<!DOCTYPE html>
<html>
<head>
  <title>Calculator using Switch Case</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
    }

    input, select {
      padding: 10px;
      margin: 10px;
      width: 200px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
    }

    #result {
      margin-top: 20px;
      font-size: 22px;
      color: blue;
    }
  </style>
</head>

<body>

  <h2>Calculator using Switch Case</h2>

  <input type="number" id="num1"
         placeholder="Enter first number">

  <input type="number" id="num2"
         placeholder="Enter second number">

  <br>

  <select id="operation">
    <option value="add">Addition (+)</option>
    <option value="subtract">Subtraction (-)</option>
    <option value="multiply">Multiplication (*)</option>
    <option value="divide">Division (/)</option>
  </select>

  <br><br>

  <button onclick="calculate()">
    Calculate
  </button>

  <div id="result"></div>

  <script>

    function calculate() {

      let num1 =
        parseFloat(document.getElementById("num1").value);

      let num2 =
        parseFloat(document.getElementById("num2").value);

      let operation =
        document.getElementById("operation").value;

      let answer;

      switch(operation) {

        case "add":
          answer = num1 + num2;
          break;

        case "subtract":
          answer = num1 - num2;
          break;

        case "multiply":
          answer = num1 * num2;
          break;

        case "divide":

          if (num2 == 0) {
            answer = "Cannot divide by zero";
          } else {
            answer = num1 / num2;
          }

          break;

        default:
          answer = "Invalid Operation";

      }

      document.getElementById("result").innerHTML =
        "Result: " + answer;

    }

  </script>

</body>
</html>
