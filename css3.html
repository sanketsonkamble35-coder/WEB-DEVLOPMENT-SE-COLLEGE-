<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
        }

        form {
            width: 300px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <form>
        <h2>Student Registration</h2>

        Name:
        <input type="text" placeholder="Enter name">

        Email:
        <input type="email" placeholder="Enter email">

        Password:
        <input type="password" placeholder="Enter password">

        Course:
        <select>
            <option>BCA</option>
            <option>BBA</option>
            <option>B.Tech</option>
        </select>

        <button type="submit">Register</button>
    </form>

</body>
</html>
