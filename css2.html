<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Grid - Responsive Layout</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .box {
      background-color: #f0a500;
      color: #fff;
      padding: 40px 20px;
      text-align: center;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 15px;
    }


  </style>
</head>
<body>

  <div class="container mt-5">
    <h2 class style="text-align: center;">Bootstrap Responsive Grid</h2>
    <p class style="text-align: center;">Three columns on desktop · Stacked on mobile</p>

    <div class="row">
      <!-- col-12 = full width on mobile, col-md-4 = one-third on desktop -->
      <div class="col-12 col-md-4">
        <div class="box">Box 1</div>
      </div>
      <div class="col-12 col-md-4">
        <div class="box">Box 2</div>
      </div>
      <div class="col-12 col-md-4">
        <div class="box">Box 3</div>
      </div>
    </div>
  </div>
<!--<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
-->
  </body>
</html>
